# docker-compose.yml に重ねて開発用の差分だけ上書きする
# 起動: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up --watch
# Colima では action: restart すると Watch が context canceled で死ぬため sync のみ
services:
  api:
    # 開発用イメージ。target は本番と同じ api / web のまま
    build:
      context: .
      dockerfile: Dockerfile.dev
    # コンテナ内のカレントディレクトリ（Dockerfile.dev の WORKDIR と揃える）
    working_dir: /app
    # bun --watch で src の変更を再起動する（package.json の dev）
    entrypoint: ["bun", "run", "dev"]
    # 起動するシェルの一時キーをコンテナへ渡す（aws configure export-credentials --format env）
    environment:
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
    # Compose Watch（up --watch が必要）。ホストで検知してコンテナへコピーする
    develop:
      watch:
        # ホスト側で監視するパス
        - path: ./api/src
          # コピー先（コンテナ内）
          target: /app/src
          # ファイルを同期するだけ。コンテナは再起動しない
          action: sync
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app/web
    entrypoint: ["bun", "run", "dev"]
    develop:
      watch:
        - path: ./web/app
          target: /app/web/app
          action: sync
        - path: ./web/next.config.ts
          target: /app/web/next.config.ts
          action: sync
        - path: ./web/tsconfig.json
          target: /app/web/tsconfig.json
          action: sync
        - path: ./tsconfig.base.json
          target: /app/tsconfig.base.json
          action: sync
        - path: ./types
          target: /app/types
          action: sync
